<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Video Hyperframes</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  </head>
  <body>
    <!--
      Hyperframes stage. The data-* attributes tell the engine how to
      drive the timeline and how big the final video is.

      Everything inside this div is part of the composition. Use .clip
      children with data-start / data-duration to sequence assets.
    -->
    <div
      id="stage"
      data-composition-id="video-hyperframes-scene"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
      data-fps="30"
    >
      <!-- Background -->
      <div class="clip bg" data-start="0" data-duration="10" data-track-index="0"></div>

      <!-- Title card -->
      <div
        id="title-card"
        class="clip"
        data-start="0.5"
        data-duration="4"
        data-track-index="1"
      >
        <h1 class="title">Open with a hook</h1>
        <p class="subtitle">Written once. Rendered frame-accurate.</p>
      </div>

      <!-- Animated stat -->
      <div
        id="stat"
        class="clip stat"
        data-start="4.5"
        data-duration="4.5"
        data-track-index="1"
      >
        <div class="stat-value" data-counter-from="0" data-counter-to="90">0</div>
        <div class="stat-label">of web-agent work is wasted</div>
      </div>
    </div>

    <script src="animate.js"></script>
  </body>
</html>
