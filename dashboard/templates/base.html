<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Video Script Dashboard{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        [x-cloak] { display: none !important; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .script-card:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
        .script-card { transition: all 0.2s ease; }
    </style>
</head>
<body class="h-full">
    <div class="min-h-full flex">
        <!-- Sidebar -->
        <nav class="w-64 bg-gray-900 text-white flex-shrink-0 hidden md:flex md:flex-col">
            <div class="p-6 border-b border-gray-700">
                <h1 class="text-xl font-bold">Script Studio</h1>
                <p class="text-gray-400 text-sm mt-1">Video Content Engine</p>
            </div>
            <div class="flex-1 py-4">
                <a href="/" class="flex items-center px-6 py-3 text-sm hover:bg-gray-800 {% if request.url.path == '/' %}bg-gray-800 text-white{% else %}text-gray-300{% endif %}">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                    Today's Scripts
                </a>
                <a href="/idea-bank" class="flex items-center px-6 py-3 text-sm hover:bg-gray-800 {% if '/idea-bank' in request.url.path %}bg-gray-800 text-white{% else %}text-gray-300{% endif %}">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
                    Idea Bank
                </a>
                <a href="/pipeline" class="flex items-center px-6 py-3 text-sm hover:bg-gray-800 {% if '/pipeline' in request.url.path %}bg-gray-800 text-white{% else %}text-gray-300{% endif %}">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
                    Pipeline
                </a>
                <a href="/stories" class="flex items-center px-6 py-3 text-sm hover:bg-gray-800 {% if '/stories' in request.url.path %}bg-gray-800 text-white{% else %}text-gray-300{% endif %}">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    Client Stories
                </a>
                <a href="/trends" class="flex items-center px-6 py-3 text-sm hover:bg-gray-800 {% if request.url.path == '/trends' %}bg-gray-800 text-white{% else %}text-gray-300{% endif %}">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
                    Trending Data
                </a>
                <a href="/history" class="flex items-center px-6 py-3 text-sm hover:bg-gray-800 {% if '/history' in request.url.path %}bg-gray-800 text-white{% else %}text-gray-300{% endif %}">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    History
                </a>
                <a href="/profile" class="flex items-center px-6 py-3 text-sm hover:bg-gray-800 {% if request.url.path == '/profile' %}bg-gray-800 text-white{% else %}text-gray-300{% endif %}">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                    Profile
                </a>
            </div>
            <div class="p-4 border-t border-gray-700 text-xs text-gray-500 space-y-2">
                <div id="model-chip" class="flex items-center justify-between">
                    <span class="text-gray-600">Powered by Claude</span>
                    <span id="model-tier" class="px-1.5 py-0.5 rounded bg-gray-800 text-gray-400 text-[10px] uppercase">—</span>
                </div>
                <a href="https://console.anthropic.com/settings/billing" target="_blank"
                   class="flex items-center gap-1 text-gray-500 hover:text-gray-300 text-[11px]">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                    Check API balance
                </a>
            </div>
        </nav>

        <!-- Mobile nav -->
        <div class="md:hidden fixed bottom-0 left-0 right-0 bg-gray-900 text-white z-50 flex justify-around py-2">
            <a href="/" class="flex flex-col items-center p-2 text-xs {% if request.url.path == '/' %}text-white{% else %}text-gray-400{% endif %}">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                Scripts
            </a>
            <a href="/idea-bank" class="flex flex-col items-center p-2 text-xs {% if '/idea-bank' in request.url.path %}text-white{% else %}text-gray-400{% endif %}">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
                Ideas
            </a>
            <a href="/stories" class="flex flex-col items-center p-2 text-xs {% if '/stories' in request.url.path %}text-white{% else %}text-gray-400{% endif %}">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                Stories
            </a>
            <a href="/history" class="flex flex-col items-center p-2 text-xs {% if '/history' in request.url.path %}text-white{% else %}text-gray-400{% endif %}">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                History
            </a>
            <a href="/profile" class="flex flex-col items-center p-2 text-xs {% if request.url.path == '/profile' %}text-white{% else %}text-gray-400{% endif %}">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                Profile
            </a>
        </div>

        <!-- Main Content -->
        <main class="flex-1 overflow-auto pb-20 md:pb-0">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-4 right-4 z-50 hidden">
        <div class="bg-gray-900 text-white px-6 py-3 rounded-lg shadow-lg flex items-center gap-2">
            <span id="toast-message"></span>
        </div>
    </div>

    <script src="/static/app.js"></script>
    <script>
        // Populate model chip in sidebar
        fetch('/api/system/model').then(r => r.json()).then(d => {
            const chip = document.getElementById('model-chip');
            const tierEl = document.getElementById('model-tier');
            if (!chip || !d || !d.info) return;
            const tier = d.info.tier || 'balanced';
            const name = d.info.name || d.model;
            const tierColors = {
                cheap: 'bg-green-900 text-green-300',
                balanced: 'bg-blue-900 text-blue-300',
                premium: 'bg-purple-900 text-purple-300',
                unknown: 'bg-gray-800 text-gray-400',
            };
            tierEl.textContent = tier;
            tierEl.className = `px-1.5 py-0.5 rounded text-[10px] uppercase ${tierColors[tier] || tierColors.unknown}`;
            chip.querySelector('span').textContent = name;
        }).catch(() => {});
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
