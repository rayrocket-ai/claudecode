services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./storage:/app/storage

  dashboard:
    build: .
    restart: unless-stopped
    env_file: .env
    command: uvicorn dashboard.app:app --host 0.0.0.0 --port 8080
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    volumes:
      - ./storage:/app/storage

  # Optional HTTPS front door for the dashboard — only for servers with
  # no reverse proxy already on ports 80/443 (Ray's Hetzner box has the
  # realtor-agent Caddy there, which carries the dashboard route
  # instead). Start explicitly with: docker compose --profile https up -d
  caddy:
    profiles: ["https"]
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - dashboard
    environment:
      - DASHBOARD_DOMAIN=${DASHBOARD_DOMAIN:-87-99-139-222.sslip.io}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./dashboard/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
