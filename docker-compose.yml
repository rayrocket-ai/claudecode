services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./storage:/app/storage

  dashboard:
    build: .
    restart: unless-stopped
    env_file: .env
    command: uvicorn dashboard.app:app --host 0.0.0.0 --port 8080
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    volumes:
      - ./storage:/app/storage
