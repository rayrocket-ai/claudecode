<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Deal Dashboard{% endblock %}</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1a202c; --muted:#64748b;
          --accent:#b45309; --border:#e2e8f0; --green:#15803d; --amber:#b45309; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1117; --card:#181b24; --text:#e8eaf0; --muted:#9aa2b5;
            --accent:#d97e4a; --border:#2a2f3e; --green:#4ade80; --amber:#fbbf24; }
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--text); line-height:1.55; }
  .wrap { max-width:1000px; margin:0 auto; padding:24px 16px 48px; }
  header { display:flex; align-items:baseline; gap:24px; flex-wrap:wrap;
           border-bottom:1px solid var(--border); padding-bottom:14px; margin-bottom:22px; }
  header h1 { font-size:20px; }
  nav a { color:var(--muted); text-decoration:none; margin-right:16px;
          font-size:14px; font-weight:600; }
  nav a.active, nav a:hover { color:var(--accent); }
  table { width:100%; border-collapse:collapse; background:var(--card);
          border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  th, td { text-align:left; padding:10px 12px; font-size:14px;
           border-bottom:1px solid var(--border); vertical-align:top; }
  th { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.06em; }
  tr:last-child td { border-bottom:none; }
  a.deal { color:var(--accent); text-decoration:none; font-weight:600; }
  a.deal:hover { text-decoration:underline; }
  .badge { display:inline-block; font-size:11px; font-weight:700; padding:2px 9px;
           border-radius:999px; border:1px solid var(--border); color:var(--muted); }
  .badge.generated, .badge.completed { color:var(--green); border-color:var(--green); }
  .deadline { color:var(--amber); font-weight:600; white-space:nowrap; }
  .muted { color:var(--muted); }
  .empty { padding:36px; text-align:center; color:var(--muted);
           background:var(--card); border:1px dashed var(--border); border-radius:10px; }
  .card { background:var(--card); border:1px solid var(--border);
          border-radius:10px; padding:18px 20px; margin-bottom:18px; }
  .card h2 { font-size:15px; margin-bottom:10px; }
  .kv { display:grid; grid-template-columns:220px 1fr; gap:6px 16px; font-size:14px; }
  .kv dt { color:var(--muted); }
  .table-scroll { overflow-x:auto; }
  @media (max-width:640px){ .kv { grid-template-columns:1fr; } .kv dt { margin-top:6px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🏠 Deal Dashboard</h1>
    <nav>
      <a href="/" class="{{ 'active' if active == 'deals' }}">Deals</a>
      <a href="/deadlines" class="{{ 'active' if active == 'deadlines' }}">Deadlines</a>
    </nav>
  </header>
  {% block content %}{% endblock %}
</div>
</body>
</html>
